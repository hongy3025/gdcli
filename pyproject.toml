[project]
name = "gdcli-e2e"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[dependency-groups]
dev = ["gdtoolkit>=4.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-v"
markers = [
    "e2e: exercises the shared Godot editor",
    "engine_transport: exercises EngineDebugger in the shared editor through explicit game lifecycle transitions",
    "real_renderer: requires the shared GUI editor and working OpenGL renderer",
]
