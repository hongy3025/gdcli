[project]
name = "gdcli-e2e"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests/e2e"]
pythonpath = ["."]
addopts = "-v -m 'not budget'"
markers = [
    "e2e: requires Godot editor running (deselect with '-m not e2e')",
    "budget: runs the nested full-suite walltime acceptance test",
]
